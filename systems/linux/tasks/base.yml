---
- name: Install Dnf Plugins
  become: true
  ansible.builtin.dnf:
    name:
      - dnf-plugins-core
    state: present
    update_cache: true

- name: Enable Copr Repositories
  become: true
  community.general.copr:
    name: "{{ item }}"
    state: enabled
  loop:
    - scottames/ghostty
    - iucar/duckdb
    - dejan/lazygit
    - jdxcode/mise

- name: Install Dependencies
  become: true
  ansible.builtin.dnf:
    name:
      - gh
      - zsh
      - 0ad
      - gcc
      - npm
      - curl
      - tree
      - tidy
      - make
      - cmake
      - unzip
      - pdftk-java
      - neovim
      - duckdb
      - pandoc
      - ghostty
      - lazygit
      - fd-find
      - ShellCheck
      - fira-code-fonts
      - poppler-glib
      - python3-notebook
      - "@development-tools"
    state: latest
    update_cache: true

- name: Check Lua Language Server Installation
  ansible.builtin.command:
    cmd: mise where aqua:LuaLS/lua-language-server
  register: lua_ls_check
  changed_when: false
  failed_when: false

- name: Install Lua Language Server
  ansible.builtin.command:
    cmd: env -u GITHUB_TOKEN -u MISE_GITHUB_TOKEN mise use --global aqua:LuaLS/lua-language-server
  environment:
    MISE_YES: "1"
  when: lua_ls_check.rc != 0
  changed_when: true

- name: Install Ollama
  become: true
  shell: |
    set -o pipefail
    curl -fsSL https://ollama.com/install.sh | sh
  args:
    creates: "/usr/local/bin/ollama"

- name: Install Pi
  become: true
  shell: |
    set -o pipefail
    curl -fsSL https://pi.dev/install.sh | sh
  args:
    creates: "/usr/local/bin/pi"
