---
- name: Install Dependencies
  community.general.homebrew:
    name:
      - fd
      - gh
      - zsh
      - gmp
      - gcc
      - curl
      - grip
      - tree
      - ruff
      - cmake
      - shfmt
      - unzip
      - pandoc
      - duckdb
      - neovim
      - stylua
      - libtool
      - lazygit
      - ghostty
      - readline
      - fennel-ls
      - openssl@3
      - shellcheck
      - font-fira-code
      - lua-language-server
    state: latest

- name: Install Common Cask Dependencies
  community.general.homebrew_cask:
    name:
      - arc
      - ollama-app
    state: latest

- name: Check Pi Installation
  ansible.builtin.command:
    cmd: command -v pi
  register: pi_check
  changed_when: false
  failed_when: false

- name: Install Pi
  shell: |
    set -o pipefail
    curl -fsSL https://pi.dev/install.sh | sh
  when: pi_check.rc != 0
  changed_when: true
